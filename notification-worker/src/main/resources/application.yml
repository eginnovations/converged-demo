server:
  port: 8082

spring:
  application:
    name: notification-worker

  artemis:
    mode: native
    broker-url: ${ARTEMIS_URL:tcp://artemis:61616}
    user: ${ARTEMIS_USER:admin}
    password: ${ARTEMIS_PASSWORD:admin}

  jms:
    listener:
      # Single consumer thread + prefetch 1 so the backlog is visible on the
      # broker instead of being buffered in the client. This is what makes the
      # queue depth climb in the Artemis console during the demo.
      concurrency: 1
      max-concurrency: 1

# Per-message processing time. Raise it to build the backlog faster.
demo:
  consumer:
    processingMs: ${CONSUMER_PROCESSING_MS:4000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
