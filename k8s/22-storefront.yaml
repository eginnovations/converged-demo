apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: converged-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: converged-demo/storefront:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8081"
            # Core Web Vitals timings (tune live via kubectl set env).
            - name: CATALOG_PRODUCTS_DELAY_MS   # Home LCP
              value: "10000"
            - name: CATALOG_REVIEWS_DELAY_MS    # Product CLS shift #1
              value: "5000"
            - name: CATALOG_RELATED_DELAY_MS    # Product CLS shift #2
              value: "10000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "400Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: converged-demo
spec:
  # NodePort so you can open the checkout page from your browser via minikube.
  type: NodePort
  selector:
    app: storefront
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
