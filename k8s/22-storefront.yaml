apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: converged-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: redzice/converged-demo-storefront:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - containerPort: 8443
          env:
            # Core Web Vitals timings (tune live via kubectl set env).
            - name: CATALOG_PRODUCTS_DELAY_MS   # Home LCP
              value: "10000"
            - name: CATALOG_REVIEWS_DELAY_MS    # Product CLS shift #1
              value: "5000"
            - name: CATALOG_RELATED_DELAY_MS    # Product CLS shift #2
              value: "10000"
          volumeMounts:
            - name: tls-keystore
              mountPath: /etc/tls
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "400Mi"
      volumes:
        - name: tls-keystore
          secret:
            secretName: storefront-tls
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: converged-demo
spec:
  type: LoadBalancer
  selector:
    app: storefront
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
