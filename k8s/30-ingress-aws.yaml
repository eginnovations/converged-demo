# AWS ALB Ingress for the Converged Demo app.
#
# This creates an AWS Application Load Balancer (ALB) that routes traffic to
# the storefront service. The ALB is automatically provisioned by the AWS Load
# Balancer Controller (installed by aws-setup.ps1).
#
# Access the app via: http://[ALB-DNS-name]/

apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: converged-demo
spec:
  type: LoadBalancer
  selector:
    app: storefront
  ports:
    - name: http
      port: 80
      targetPort: 8443
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: converged-demo
  namespace: converged-demo
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Health check for the storefront service
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
spec:
  tls:
    - hosts:
        - converged-demo.local
      secretName: converged-demo-tls
  rules:
    - host: converged-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 80
