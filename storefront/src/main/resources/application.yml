server:
  port: 8443
  ssl:
    enabled: true
    key-store: /etc/tls/keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: converged-demo
  http2:
    enabled: true

spring:
  application:
    name: storefront

order:
  service:
    url: ${ORDER_SERVICE_URL:http://order-service:8081}

catalog:
  productsDelayMs: ${CATALOG_PRODUCTS_DELAY_MS:10000}
  productDelayMs: ${CATALOG_PRODUCT_DELAY_MS:1200}
  reviewsDelayMs: ${CATALOG_REVIEWS_DELAY_MS:5000}
  relatedDelayMs: ${CATALOG_RELATED_DELAY_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
