<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ShopFast — Product</title>
    <link rel="stylesheet" href="/styles.css"/>
    <!-- eG Enterprise Real User Monitoring -->
    <script src='https://172.31.43.141:7077/rumcollector/egrum.js?srn=2147e5e7-5649-4ed5-a57b-d05f915076a4-1785759694810' async> </script>
    <script src="/session.js"></script>
</head>
<body>
<div class="nav"><div class="nav-in">
    <a class="brand" href="/index">Shop<span>Fast</span></a>
    <a class="link" href="/index">Home</a>
    <div class="spacer"></div>
    <span class="user">👤&nbsp;<span id="rumUser" data-rum-user=""></span></span>
    <a class="link" href="#" onclick="egLogout();return false;">Logout</a>
    <a class="cart-pill" href="/cart">🛒 Cart (2)</a>
</div></div>

<div class="wrap">
    <!-- Two no-height blocks. They fill when the slow catalog calls return and
         push the product (above the fold) down TWICE -> large, visible CLS. -->
    <div id="clsTop"></div>
    <div id="clsMain"></div>

    <div class="crumb"><a href="/index">Home</a> › <span id="crumbName">Product</span></div>

    <div class="pdp">
        <div id="pImg"><div class="sk" style="width:100%;height:420px"></div></div>
        <div>
            <h1 class="page" id="pName">Loading…</h1>
            <div class="price" id="pPrice"></div>
            <p class="muted">Free next-day delivery. 2-year warranty. 30-day returns.</p>
            <button class="btn" onclick="addToCart()">Add to cart</button>
        </div>
    </div>

    <!-- These two blocks are injected LATE with no reserved height, so when the
         reviews (~2.5s) and the "bought together" strip (~4.5s) arrive they push
         the page down. That accumulating shift is the CLS story on this page. -->
    <div id="reviews" style="margin-top:24px"></div>
    <div id="related" style="margin-top:8px"></div>
</div>

<script>
    function imgSvg(color, label, w, h){
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='"+w+"' height='"+h+"'>"+
            "<rect width='100%' height='100%' fill='"+color+"'/>"+
            "<text x='"+Math.round(w*0.06)+"' y='"+Math.round(h*0.54)+"' font-size='"+Math.round(h*0.08)+
            "' fill='white' font-family='sans-serif'>"+label+"</text></svg>";
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }
    function money(n){ return "$" + Number(n).toFixed(2); }
    function starRow(n){ return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n); }

    var id = new URLSearchParams(location.search).get('id') || 'h1';

    fetch('/api/product?id=' + id).then(function(r){ return r.json(); }).then(function(p){
        document.getElementById('crumbName').textContent = p.name;
        document.getElementById('pName').textContent = p.name;
        document.getElementById('pPrice').textContent = money(p.price);
        document.getElementById('pImg').innerHTML =
            '<img alt="' + p.name + '" style="width:100%;border-radius:12px" src="' +
            imgSvg(p.color, p.name.split(" ")[0], 640, 640) + '"/>';
        window.__price = p.price;
    });

    function promoHtml(){
        return '<div class="card" style="background:#ff8a00;color:#fff;min-height:340px;' +
            'display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;' +
            'font-size:24px;font-weight:800;line-height:1.4;margin-bottom:16px">' +
            '⬇ THIS BIG BANNER LOADED LATE (~5s) AND PUSHED THE PAGE DOWN' +
            '<div style="font-size:18px;margin-top:8px">That jump = Layout Shift #1 — this is CLS.</div>' +
            '<div style="font-size:14px;font-weight:500;margin-top:10px;opacity:.9">' +
            '(no height was reserved for me, so everything below me moved down)</div></div>';
    }
    function stripHtml(){
        return '<div class="card" style="background:#0b4f8a;color:#fff;min-height:130px;' +
            'display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;' +
            'font-size:18px;font-weight:700;margin-bottom:16px">' +
            '⬇ ANOTHER LATE BANNER (~10s) — Layout Shift #2' +
            '<div style="font-size:14px;font-weight:500;margin-top:6px;opacity:.9">' +
            'two big shifts add up to a high CLS score</div></div>';
    }

    // Late reviews -> big banner drops in and pushes the product down (visible shift #1)
    fetch('/api/reviews?id=' + id).then(function(r){ return r.json(); }).then(function(list){
        document.getElementById('clsMain').innerHTML = promoHtml();

        document.getElementById('reviews').innerHTML =
            '<div class="card"><h3>Customer reviews</h3>' + list.map(function(rv){
                return '<div class="review"><div class="stars">' + starRow(rv.stars) + '</div>' +
                    '<b>' + rv.author + '</b><div class="muted">' + rv.text + '</div></div>';
            }).join('') + '</div>';
    });

    // Late related -> a second banner appears above and pushes everything down again (shift #2)
    fetch('/api/related?id=' + id).then(function(r){ return r.json(); }).then(function(list){
        document.getElementById('clsTop').innerHTML = stripHtml();

        document.getElementById('related').innerHTML =
            '<div class="card"><h3>Frequently bought together</h3><div class="grid">' +
            list.map(function(p){
                return '<a class="tile" href="/product?id=' + p.id + '">' +
                    '<img alt="' + p.name + '" src="' + imgSvg(p.color, p.name.split(" ")[0], 400, 300) + '"/>' +
                    '<div class="body"><div class="name">' + p.name + '</div>' +
                    '<div class="price">' + money(p.price) + '</div></div></a>';
            }).join('') + '</div></div>';
    });

    function addToCart(){ location.href = '/cart'; }
</script>
</body>
</html>
