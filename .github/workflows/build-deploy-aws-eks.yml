name: Build and Deploy to AWS EKS

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -q

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/converged-demo-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and push storefront image
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/storefront:${{ github.sha }} ./storefront
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/storefront:${{ github.sha }}
          docker tag ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/storefront:${{ github.sha }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/storefront:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/storefront:latest

      - name: Build and push order-service image
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/order-service:${{ github.sha }} ./order-service
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/order-service:${{ github.sha }}
          docker tag ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/order-service:${{ github.sha }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/order-service:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/order-service:latest

      - name: Build and push notification-worker image
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/notification-worker:${{ github.sha }} ./notification-worker
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/notification-worker:${{ github.sha }}
          docker tag ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/notification-worker:${{ github.sha }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/notification-worker:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/notification-worker:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Create namespace if not exists
        run: kubectl create namespace converged-demo --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply K8s manifests (infra)
        run: kubectl apply -f k8s/00-namespace.yaml -f k8s/10-mysql.yaml -f k8s/11-artemis.yaml -f k8s/12-payment-gateway.yaml

      - name: Wait for infra to be ready
        run: |
          kubectl rollout status statefulset/mysql -n converged-demo --timeout=300s || true
          kubectl rollout status statefulset/artemis -n converged-demo --timeout=300s || true

      - name: Update app images
        run: |
          kubectl set image deployment/storefront storefront=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/storefront:${{ github.sha }} -n converged-demo
          kubectl set image deployment/order-service order-service=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/order-service:${{ github.sha }} -n converged-demo
          kubectl set image deployment/notification-worker notification-worker=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/converged-demo/notification-worker:${{ github.sha }} -n converged-demo

      - name: Apply app manifests
        run: kubectl apply -f k8s/20-order-service.yaml -f k8s/21-notification-worker.yaml -f k8s/22-storefront.yaml -n converged-demo

      - name: Apply Ingress (AWS ALB)
        run: kubectl apply -f k8s/30-ingress-aws.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/storefront -n converged-demo --timeout=300s
          kubectl rollout status deployment/order-service -n converged-demo --timeout=300s
          kubectl rollout status deployment/notification-worker -n converged-demo --timeout=300s

      - name: Get ALB endpoint
        run: |
          echo "=== Deployment Complete ==="
          echo "Waiting for ALB to be provisioned (30s)..."
          sleep 30
          ALB_DNS=$(kubectl get ingress converged-demo -n converged-demo -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          echo "ALB Endpoint: http://$ALB_DNS"
          echo "Pod Status:"
          kubectl get pods -n converged-demo
